name: laprea
description: "laprea app"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  common:
    path: modules/common
  service:
    path: modules/service

  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  talker_flutter: ^4.9.1
  talker_dio_logger: ^4.9.1
  talker_bloc_logger: ^4.9.1
  rxdart: ^0.28.0
  auto_route: ^9.2.2
  equatable: ^2.0.7
  get_it: ^8.0.3
  flutter_svg: ^2.2.0
  provider: ^6.1.5
  flutter_native_splash: ^2.4.6
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  table_calendar: ^3.2.0
  dio: ^5.8.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.9
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/bottom_bar/
    - assets/images/
    - assets/images/temp/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800

flutter_intl:
  enabled: true

  main_locale: ru

  arb_dir: lib/l10n

  output_dir: lib/generated/localization